          - paragraph [ref=e76]:
            - strong [ref=e77]: 说明：
            - text: 银杏不要求提供身份证、银行卡或账号密码。请勿在问题反馈中填写姓名、手机号等与排查无关的信息。
        - generic [ref=e78]:
          - heading "3. 权限如何使用" [level=2] [ref=e79]
          - list [ref=e80]:
            - listitem [ref=e81]:
              - strong [ref=e82]: 电话、联系人、通话记录：
              - text: 用于拨号、展示联系人、识别来电和自动接听。拒绝后，相关电话功能不可用，但其他基本功能仍可使用。
            - listitem [ref=e83]:
              - strong [ref=e84]: 位置：
              - text: 仅在使用“当前位置天气”时获取大致位置。可改为手动选择城市。
            - listitem [ref=e85]:
              - strong [ref=e86]: 无障碍服务：
              - text: 仅用于用户主动配置的微信视频辅助操作。该权限能够读取屏幕控件并执行手势，属于高敏感权限，可随时在系统设置中关闭。
            - listitem [ref=e87]:
              - strong [ref=e88]: 通知、悬浮窗、后台运行和开机启动：
              - text: 用于显示来电、跌倒检测和视频通话状态，并提高用户开启功能后的持续运行能力。
            - listitem [ref=e89]:
              - strong [ref=e90]: 传感器：
              - text: 仅在跌倒检测开启后使用加速度数据进行本机实时判断。
            - listitem [ref=e91]:
              - strong [ref=e92]: 文件访问：
              - text: 用于选择或保存联系人头像、导出用户主动生成的诊断文件，以及完成相关文件操作。
          - paragraph [ref=e93]: 银杏按具体功能申请权限，不会因为你拒绝非必要权限而阻止使用无关功能。你可以随时在 Android 系统设置中撤回授权。
        - generic [ref=e94]:
          - heading "4. 联网与第三方服务" [level=2] [ref=e95]
          - paragraph [ref=e96]: 银杏没有广告或商业统计 SDK。以下联网服务只在对应功能中使用：
          - list [ref=e97]:
            - listitem [ref=e98]:
              - strong [ref=e99]: Open-Meteo：
              - text: 接收城市名称或坐标，用于城市查询和天气预报。其服务器可能位于中国大陆境外；不同意时请勿使用天气功能。
            - listitem [ref=e100]:
              - strong [ref=e101]: 系统地理编码服务：
              - text: 取得当前位置城市名称时，Android 系统可能根据设备厂商配置调用其地理编码服务。
            - listitem [ref=e102]:
              - strong [ref=e103]: 银杏日志服务（log.likeyou.qzz.io）：
              - text: 接收前述诊断与反馈信息，用于项目维护和故障排查。
            - listitem [ref=e104]:
              - strong [ref=e105]: 银杏下载站与 GitHub：
              - text: 仅在检查更新、打开网站、源码或下载页面时访问；访问后适用对应网站的规则。
          - paragraph [ref=e106]: 网络连接会向服务提供方传递 IP 地址等建立连接所必需的信息。银杏不会把联系人姓名、电话号码或微信界面内容主动发送给天气服务。
        - generic [ref=e107]:
          - heading "5. 保存期限与删除" [level=2] [ref=e108]
          - list [ref=e109]:
            - listitem [ref=e110]: 设备本地的联系人、头像、紧急联系人、天气缓存和设置，一般保存到你删除内容、清除应用数据或卸载应用。启用系统云备份时，部分本地数据可能由 Android 备份服务按系统设置处理。
            - listitem [ref=e111]: 待发送的诊断报告发送成功后会从本地队列移除；队列最多保留 50 条，超过后自动覆盖较早内容。
            - listitem [ref=e112]: 日志服务按服务端接收时间执行定期清理：普通日志保存 30 天，异常日志和原始性能指标保存 90 天。法律另有要求或处理争议确有必要时，可能在必要范围内延长保存。
          - paragraph [ref=e113]: 你可以清除应用数据或卸载应用来删除本地信息。需要查询、更正、复制或删除已经发送到日志服务的信息，或撤回相关同意，可通过联系邮箱提出请求。为了定位随机安装标识，我们可能需要你提供应用内导出的诊断信息。
        - generic [ref=e114]:
          - heading "6. 信息保护" [level=2] [ref=e115]
          - paragraph [ref=e116]: 我们采取 HTTPS 传输、随机安装标识、敏感字段脱敏、本地私有存储和最小权限等措施保护信息。互联网传输和软件运行无法保证绝对安全；发生可能影响个人权益的安全事件时，我们会依法采取补救和告知措施。
        - generic [ref=e117]:
          - heading "7. 长辈、未成年人及他人信息" [level=2] [ref=e118]
          - paragraph [ref=e119]: 银杏主要面向长辈及协助配置手机的家属。家属添加联系人、开启自动接听或设置紧急联系人前，应确认已获得设备使用者和相关联系人的同意。未成年人应在监护人指导下使用本应用。
        - generic [ref=e120]:
          - heading "8. 政策更新与联系我们" [level=2] [ref=e121]
          - paragraph [ref=e122]: 功能或信息处理方式发生重要变化时，我们会更新本政策，并通过应用、网站或版本说明提示。重大变化需要重新征得同意的，我们会依法另行处理。
          - paragraph [ref=e123]:
            - text: 联系邮箱：
            - link "2632507193@qq.com" [ref=e124] [cursor=pointer]:
              - /url: mailto:2632507193@qq.com
