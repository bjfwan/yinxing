      - article [ref=e25]:
        - generic [ref=e26]:
          - heading "1. 我们是谁" [level=2] [ref=e27]
          - paragraph [ref=e28]:
            - text: 银杏是一款源码可见、个人免费的 Android 长辈桌面，由银杏项目维护者提供和维护。个人信息相关问题可发送邮件至
            - link "2632507193@qq.com" [ref=e29] [cursor=pointer]:
              - /url: mailto:2632507193@qq.com
            - text: 。
        - generic [ref=e30]:
