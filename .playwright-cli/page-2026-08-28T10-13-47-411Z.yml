                - cell "跌倒检测" [ref=e57]
                - cell "加速度传感器读数、紧急联系人号码、检测及拨号状态" [ref=e58]
                - cell "在用户开启功能后判断疑似跌倒，并按用户设置发起紧急联系" [ref=e59]
                - cell "紧急联系人和功能设置保存在设备本地；传感器读数实时处理" [ref=e60]
              - row [ref=e61]:
                - cell "应用与设置" [ref=e62]
                - cell "已安装应用的基本信息、首页排列、显示、权限确认及其他应用设置" [ref=e63]
                - cell "生成桌面入口并记住用户选择" [ref=e64]
                - cell "设备本地" [ref=e65]
              - row [ref=e66]:
                - cell "诊断与反馈" [ref=e67]
                - cell "随机安装标识、时间、应用版本、设备型号和系统、屏幕与内存等设备状态、功能使用与性能事件、崩溃或卡顿信息、脱敏诊断日志，以及用户主动填写的反馈" [ref=e68]
                - cell "定位故障、判断兼容性和改进稳定性；网络不可用时最多在本地暂存 50 条待发送报告" [ref=e69]
                - cell "待发送报告保存在设备本地；发送后由项目日志服务处理" [ref=e70]
