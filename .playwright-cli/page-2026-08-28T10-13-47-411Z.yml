                - cell "展示常用联系人、发起电话、识别来电和实现用户开启的自动接听" [ref=e44]
                - cell "主要保存在设备本地" [ref=e45]
              - row [ref=e46]:
                - cell "微信视频辅助" [ref=e47]
                - cell "用户配置的视频联系人；微信界面中的控件文字、结构和操作状态" [ref=e48]
                - cell "在用户主动发起视频通话时，通过无障碍服务查找并操作对应控件" [ref=e49]
                - cell "联系人和配置保存在设备本地；界面内容仅在执行过程中处理" [ref=e50]
              - row [ref=e51]:
                - cell "天气" [ref=e52]
