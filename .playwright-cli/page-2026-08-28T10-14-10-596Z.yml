      - article [ref=f1e27]:
        - generic [ref=f1e28]:
          - heading "1. 服务说明" [level=2] [ref=f1e29]
          - paragraph [ref=f1e30]: 银杏是一款源码可见、个人免费的 Android 长辈桌面，提供简化首页、电话与联系人、微信视频辅助、天气、来电辅助、跌倒检测和家属设置等功能。具体功能会因应用版本、Android 版本、设备厂商、系统权限、网络和第三方应用状态而不同。
          - paragraph [ref=f1e31]: 银杏无需注册账号，不提供付费服务或广告。项目维护者可根据实际情况更新、调整或停止部分功能，并尽量通过版本说明或网站告知。
        - generic [ref=f1e32]:
          - heading "2. 使用资格与家属配置" [level=2] [ref=f1e33]
          - paragraph [ref=f1e34]: 你应当具备与使用行为相适应的民事行为能力。由家属、照护者或设备维护者代为配置时，应向设备使用者说明功能和权限，并取得必要同意。涉及联系人、头像、电话号码等他人信息时，你应确保有权使用这些信息。
        - generic [ref=f1e35]:
          - heading "3. 权限与用户选择" [level=2] [ref=f1e36]
          - paragraph [ref=f1e37]: 电话、联系人、位置、无障碍、通知、悬浮窗、后台运行和传感器等权限只服务于相应功能。你可以拒绝或撤回非必要权限；相应功能可能因此无法使用，但不应影响无关功能。
          - paragraph [ref=f1e38]: 无障碍服务能够读取屏幕控件并执行操作，只应在理解其作用后开启。自动接听、后台运行和跌倒检测也应由设备使用者或获得授权的家属明确开启。
        - generic [ref=f1e39]:
          - heading "4. 重要安全边界" [level=2] [ref=f1e40]
          - paragraph [ref=f1e41]:
            - strong [ref=f1e42]: 银杏不是医疗器械、急救服务、看护服务或电信运营商服务，不能替代人工照护、医生判断、报警电话或其他可靠的紧急求助方式。
          - list [ref=f1e43]:
            - listitem [ref=f1e44]: 自动接听可能受到默认电话角色、系统省电策略、权限和厂商限制影响，不能保证每次成功。
            - listitem [ref=f1e45]: 跌倒检测基于手机传感器和算法，可能漏报或误报。请勿把它作为唯一的安全保障。
            - listitem [ref=f1e46]: 紧急拨号前应核对号码，并定期在安全条件下确认相关功能和设备状态。
            - listitem [ref=f1e47]: 微信视频辅助依赖微信界面，第三方应用升级后可能暂时失效或执行结果不同。
            - listitem [ref=f1e48]: 天气信息仅供日常参考，不应用于救灾、航行、医疗等高风险决策。
        - generic [ref=f1e49]:
          - heading "5. 合理使用" [level=2] [ref=f1e50]
          - paragraph [ref=f1e51]: 你不得利用银杏从事违法活动，不得侵害他人的隐私、通信自由、知识产权或其他合法权益，不得绕过系统安全机制、干扰服务或利用项目接口进行攻击、批量滥用和未经授权的数据收集。
          - paragraph [ref=f1e52]: 你应妥善保管设备，并自行判断是否开启自动操作、后台和敏感权限。因设备交给他人、错误配置或未经授权使用造成的风险，应及时通过系统设置关闭相关功能和权限。
        - generic [ref=f1e53]:
          - heading "6. 第三方服务" [level=2] [ref=f1e54]
          - paragraph [ref=f1e55]: 天气、系统地理编码、微信、GitHub、下载站点和 Android 系统能力由第三方或设备厂商提供，受其规则和可用性影响。银杏不控制第三方服务，也不对其持续可用、内容准确或规则变更作出保证。具体信息处理方式见《隐私政策》。
        - generic [ref=f1e56]:
          - heading "7. 软件许可与知识产权" [level=2] [ref=f1e57]
          - paragraph [ref=f1e58]: 银杏当前源代码按照 PolyForm Noncommercial License 1.0.0 提供。这是一份源码可见的非商业许可，不是 OSI 定义下的开源许可。
          - list [ref=f1e59]:
            - listitem [ref=f1e60]:
              - strong [ref=f1e61]: 允许的用途：
              - text: 个人在没有预期商业用途的情况下，可以使用、研究、测试和修改；许可列明的非营利、教育、公共研究、公共安全或卫生、环保和政府机构，也可用于非商业目的。
            - listitem [ref=f1e62]:
              - strong [ref=f1e63]: 修改和分发：
              - text: 仅可为许可允许的非商业目的修改和分发，并须向接收者保留许可条款和 Required Notice。
            - listitem [ref=f1e64]:
              - strong [ref=f1e65]: 商业用途：
              - text: 企业经营或内部业务、随硬件交付、集成到商业产品或服务、为客户部署，以及用于广告、引流或获客等用途，均须事先取得作者的付费书面授权。
            - listitem [ref=f1e66]:
              - strong [ref=f1e67]: 其他限制：
              - text: 许可不授予再许可或转让许可的权利；软件在法律允许范围内按现状提供，不附带保证。
          - paragraph [ref=f1e68]:
            - text: 商业授权请联系
            - link "2632507193@qq.com" [ref=f1e69] [cursor=pointer]:
              - /url: mailto:2632507193@qq.com
            - text: 。此前已按 MIT License 发布的历史版本继续适用其原有许可，本次变更不追溯收回既有授权。第三方依赖和素材继续适用各自许可。“银杏”名称、图标和网站内容等未包含在软件许可中的素材，不因下载或使用软件而转让。
        - generic [ref=f1e70]:
          - heading "8. 服务可用性与责任" [level=2] [ref=f1e71]
          - paragraph [ref=f1e72]: 银杏按现状提供。我们会合理维护功能和安全，但不能保证软件始终无错误、不中断、适配所有设备，或一定达到特定目的。对于依法不能排除或限制的责任，本条款不作排除或限制。
          - paragraph [ref=f1e73]: 在法律允许的范围内，因系统限制、第三方服务、网络故障、设备故障、用户配置或不可抗力造成的功能不可用，项目维护者不承担超出法律规定范围的责任。发现问题时，请停止依赖相关功能并通过联系邮箱反馈。
        - generic [ref=f1e74]:
          - heading "9. 条款变更与终止使用" [level=2] [ref=f1e75]
          - paragraph [ref=f1e76]: 功能、法律要求或运营方式发生变化时，我们可能更新本条款，并在应用、网站或版本说明中公布。你不同意更新后的条款时，可以停止使用并卸载银杏。你也可以随时撤回权限、清除应用数据或卸载应用。
        - generic [ref=f1e77]:
          - heading "10. 法律适用与联系" [level=2] [ref=f1e78]
          - paragraph [ref=f1e79]: 本条款适用中华人民共和国法律。发生争议时，双方应先友好协商；无法解决的，依照适用法律处理。本条款部分内容无效或不可执行，不影响其他内容的效力。
