name: Sync website release history

on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-website-release-history
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Refresh release manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/sync-release-history.mjs

      - name: Open release history pull request
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: docs/releases.json
          base: ${{ github.event.repository.default_branch }}
          branch: automation/sync-release-history
          delete-branch: true
          commit-message: Sync website release history
          title: Sync website release history
          body: Automatically refresh `docs/releases.json` from published GitHub Releases.
